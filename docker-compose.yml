services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: lyrics-rest-api:latest
        ports:
            - "8080:8080"
        env_file:
            - .env
        environment:
            - PORT=8080
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        volumes:
            - uploads:/app/assets/uploads
        networks:
            - default
            - monitoring

    db:
        image: postgres:15
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        command: ["postgres", "-c", "timezone=Africa/Addis_Ababa"]
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - default
            - monitoring

volumes:
    db-data:
    uploads:
networks:
    default:
    monitoring:
        external: true
